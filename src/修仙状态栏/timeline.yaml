# 修仙界编年时间轴 · 素材库（运行时按玩家情况动态生成事件）
#
# 重要变更：本文件不再存放静态事件列表。
# 事件由 `timeline-engine.ts` 在每次玩家时间/地点/境界变化时，按下方
# 「模板」+「字典」动态拼装并缓存到 localStorage。游戏内置 3000 年时间跨度，
# 静态列出是不现实的，因此改为"无穷生成"的素材库模式。
#
# 本文件只承担两件事：
#   1) 顶部注释：写作要求 / 命名规则 / 类别约束 / NPC 名号黑名单（人类阅读）
#   2) 底部结构化数据：模板 + 字典（程序读取）
#
# === 编写要求（重要）===
# 时间轴独立于 AI 叙事运转：模板写好后不再变动，AI 也不知道这里写了什么。
# 因此每一条拼装出来的事件都必须满足以下条件，否则会与 AI 当下生成的剧情冲突：
#
#   1. 【不指名具体人物 / 势力】
#      ✗ "问道仙宗李道玄突破金丹"   ✓ "中原某门派举行筑基大典"
#      具体修士、宗门主事的状态由 AI 实时维护，写死会撞车。
#      通缉类事件不再使用"代号 / 别号"，告示口吻保持中性——仅披露
#      ①境界（{境界档}）②性别（{性别}）③罪行（{罪行}）三项基本信息，
#      避免在告示里把人物预先打成"魔修"，便于 AI 后续接驳。
#
#   2. 【避免毁灭性、不可逆的世界事件】
#      ✗ "陨石坠落毁灭东土"        ✓ "东土近月流星增多，众多修士争夺陨铁"
#      ✗ "灵脉断绝中原大旱"        ✓ "中原春季灵气稀薄，散修反映打坐效率略降"
#      不要通过时间轴改写地理、势力存亡、世界规则。
#
#   3. 【用"传闻 / 据说 / 告示"口吻，留出再诠释余地】
#      ✗ "X 月 X 日某宗已被屠灭"   ✓ "据茶客闲谈，某宗近况堪忧"
#      模糊语气让 AI 可以接得住，肯定式断言容易翻车。
#
#   4. 【时间区间宜宽不宜窄】
#      由引擎按玩家境界档自动决定：低境界 4~12 月、中境界 1~3 年、高境界 3~10 年。
#      模板/字典作者不需要写时间区间，引擎会现场生成。
#
#   5. 【地点 / 兽群 / 灵植 三槽必须生态自洽】
#      地点：用世界书已存在的"自然地名"，写到地域 / 自然地标层级即可。
#      ✓ "凡界·中原" "凡界·中原·中州沃野" "凡界·北境·不周残脊"
#      ✗ "凡界·中原·问道仙宗"（问道仙宗存在，但属势力，违反第 1 条）
#      {地点限定} {兽群} {灵植} 由引擎按当前 地域 抽取（合并 槽位名_<地域> + 槽位名_通用 两池），
#      避免"凡界·西域 + 老林深处 + 沙地巨蝎在雨林"这种生态穿模。
#      各地域的候选源自世界书《地域总览.txt》中的 RES 字典，新增地域时同步追加三套子字典即可。
#
#   6. 【难度只是参与门槛建议，不是硬筛选】
#      它告诉玩家"你目前是否吃得下这个事件"，不会阻止低境界玩家看到高境界事件。
#      但跨 2 个 tier（low ↔ high）的事件被引擎隐藏，详见规则 11.B。
#
#   7. 【凡界事件中的敌方境界上限 = 元婴后期】
#      化神在凡界极其稀少、属"论外"存在；时间轴若写化神级威胁，会让低境界玩家
#      看到的"传闻氛围"立刻失真。凡界范围内的妖兽王、通缉魔修、秘境守卫等
#      一律不超过 元婴后期。化神档专属事件只走「时空裂缝」类别，处理空间裂缝/灵界
#      通道等不涉及凡界战斗的题材。
#
#   8. 【时间轴奇遇与世界书秘境互相独立，不要重叠】
#      世界书已经定义了一批带刷新周期的官方秘境（如七曜藏星窟、沉船浮港、孢光雾渊、
#      镜中歧路、承天论剑台等），它们由世界书规则自然轮转，AI 会按时开关。
#      模板中的「秘境传闻 / 宝物现世」只描述世界书未定义的小型、民间、野遗秘境，
#      不要与官方秘境同名或同坐标。
#
#   9. 【凡界事件时间区间限定 7000 ~ 10000 年】
#      自定义开局玩家起始年最早为修仙历 7000 年；世界书设定 10000 年凡界归墟大劫。
#      引擎会拒绝在此区间外生成凡界事件。灵界 / 仙界暂无时间限制。
#
#  10. 【灵石与物品命名必须合规（依《经济系统》与《物品功法生成规则》）】
#      A. 灵石只有一种计价单位 — 下品灵石，简称"灵石"：
#         ✗ "中品灵石五百"  "上品灵石三十"   "10极品灵石"
#         ✓ "5万灵石"        "3千灵石"        "100万灵石"
#         {灵石数额} 由引擎按《经济系统》悬赏公式 floor(10^L × 难度乘数) 自动计算，
#         难度乘数：通缉魔修=10、高额悬赏=3、宝物现世=2、坊市集会=3、其它=3。
#         L 取事件难度区间的"上界境界"（如 练气前期-练气后期 → L=1.4，高者为准）。
#         作者不需要在模板里写死灵石数字，只用 {灵石数额} 占位即可。
#      B. 物品品质必须是 五阶之一：凡 / 黄 / 玄 / 地 / 天
#         ✗ "二阶丹药"  "三阶法宝"  "一阶秘籍"
#         ✓ "黄阶丹药"  "玄阶法宝"  "凡阶秘籍"
#      C. 物品类型必须从合法枚举中选：
#         物品: 秘籍 / 配方 / 符箓 / 丹药 / 素材 / 工具
#         装备: 法宝 / 护甲 / 饰品
#         功法: 心法 / 攻击 / 咒法 / 神识 / 身法 / 护体 / 幻术 / 阵法
#      D. 境界用 练气/筑基/金丹/元婴/化神，不写 "X 阶"。
#
#  11. 【事件发生频率与可见度 — 由引擎按下表执行】
#      A. 频率（依玩家当前境界档分发）：
#           练气期 ~ 筑基期 (low)：每年 1 ~ 2 个事件，并发活跃数 ~2
#           金丹期 ~ 元婴期 (mid)：每 2 ~ 3 年 1 个事件，并发活跃数 ~1
#           化神期         (high)：每 10 年 1 个事件，并发活跃数 ~1，全部走秘境/时空裂缝类
#      B. 可见度（依事件 tier 与玩家 tier 的距离）：
#           |玩家tier - 事件tier| ≤ 1 才显示
#           ✓ low 玩家可见 low / mid 事件；mid 玩家可见全部；high 玩家可见 mid / high
#           ✗ low 玩家看不到 high 事件；high 玩家看不到 low 事件（差 2 级隐藏）
#           引擎不会为不可见的 tier 生成事件（生成 = 玩家当前 tier 一档）。
#
#  12. 【生成模式 — 以"玩家当前 (世界, 地域)"为单位】
#      A. 玩家从 北境 移动到 中原：北境的已生成事件暂存（不再生成新的），UI 只显示中原的事件。
#      B. 玩家返回北境且北境旧事件尚未过期：UI 重新显示之；过期则被自动丢弃。
#      C. 引擎检测：每次 MVU 数据变更（时间、地点、境界），都会跑一次
#         "丢弃过期 → 补足目标活跃数" 的流程；缓存按 chat 维度存在 localStorage。
#
# === 字段格式（运行时生成事件的形状）===
#   id:        唯一标识
#   时间区间:  { 起: {年,月,日}, 止: {年,月,日} }
#   世界:      凡界 / 灵界 / 仙界
#   地域:      具体地域名（中原 / 东土 / 北境 / 南疆 / 西域 / ...）
#   地点:      引擎拼装的完整地点串，用于 UI 展示
#   类别:      下方枚举（12 选 1）
#   内容:      由模板 + 字典拼装；已是替换完成的完整句子
#   难度:      引擎按玩家境界档抽取，如 "练气前期-练气后期"
#
# === 类别（12 选 1，不再含 修仙界要闻 / 宗门内务）===
#   秘境异闻类（与玩家无关的世界客观机遇，最安全）：
#     秘境传闻   某处秘境 / 古洞开启的小道消息
#     高额悬赏   匿名委托或坊市公榜，不指名委托人
#     妖兽异动   兽群迁徙、巢穴扩张等自然现象（生态感知，{兽群} 由地域决定）
#     通缉魔修   官方追捕令；告示口吻中性，只披露 境界 / 性别 / 罪行
#     宝物现世   传闻中的奇物、灵药、矿脉出土
#     灵植奇遇   灵药 / 灵植 即将成熟、群落显形等机缘（生态感知，{灵植} 由地域决定）
#   节令市井类（周期性、烟火气，不影响世界格局）：
#     坊市集会   定期开市、拍卖、丹会、剑会等活动
#     节令风物   节庆、季节、温和的天象变化（非灾变）
#     商道见闻   匿名商队 / 旅人沿途风物
#   天地玄谈类（背景氛围，不改变世界状态）：
#     灵气潮汐   周期性的天地灵气盈亏（区别于"灵脉异变"那种突变）
#     古迹奇谭   已存在的传说、碑文、地脉典故
#   化神专属类（仅化神档玩家可见，引擎在 high tier 时 100% 偏置至秘境类 + 此类）：
#     时空裂缝   空间裂缝 / 灵界通道相关传闻（依《世界观》凡→灵通道已闭，仅极偶现）
#
# === 已存在的世界书 NPC 名 / 号清单（写任何具名内容时务必避开）===
#   顾昭宁 / 阮卿颜 / 南宫梦 / 断魂 / 石谦勇 / 陈忆涟
#   李道玄 / 林素水 / 洛雪铃 / 张虚怀 / 田殊兰 / 蓝幽月
#   通幽 / 龙归芸 / 龙璇玑 / 龙飞扬 / 凤长歌 / 凰千羽 / 凰韶音
#   苏凝香 / 苏晴韵 / 墨诗行 / 白秋禾 / 莫决云 / 姜行露
#   （后续世界书新增 NPC 时同步追加，当前通缉类不再用代号，此清单仅作其他字典扩展时的参考。）
#
# ================================================================
# 以下为结构化数据，由 timeline-engine.ts 读取并参与拼装
# ================================================================

# 生态相关字典命名约定：
#   {地点限定} / {兽群} / {灵植} 三个槽位 → 引擎按 槽位名_<地域> + 槽位名_通用 合并池抽取
#   例：玩家在 凡界·北境 时，{兽群} 从 兽群_北境 + 兽群_通用 中抽
#   新增地域只需补 地点限定_<新地域>、兽群_<新地域>、灵植_<新地域> 三套即可
#   各地域的 兽群 / 灵植 候选直接整理自世界书 凡界/<地域>/<地域>总览.txt 中的 RES 字典

# 模板：按类别分组。每条模板是一个含 {占位符} 的字符串。
# 引擎会从 字典 中按占位符名抽取替换；占位符可嵌套，引擎会递归展开。
# 引擎在拼装时会另外注入这些"固定槽"：
#   {世界} {地域} {地点} {境界档} {灵石数额} {地点限定} {兽群} {灵植}
# 其中 {地点限定} {兽群} {灵植} 在生成时按当前地域预先抽好，
# 同一事件内多次引用为同一个值（保证叙事一致：A 句出现的妖兽 = B 句首领提到的妖兽）。
模板:
  妖兽异动:
    - "{传闻起句}{地点限定}{时段}{兽群}{兽群行径}；{见闻补充}。"
    - "{时段}{地点限定}{兽群}{兽群行径}，{发现者}建议{应对建议}；另有人提及{异象兽特征}的{兽群}首领踪迹。"
    - "据{发现者}传报，{地点}{地点限定}近年来{兽群}活动反常，{兽群行径}，{见闻补充}。"
    - "{时段}{地点}{地点限定}{兽群}成势，{兽群行径}，{发现者}转述其{异象兽特征}之状，{应对建议}。"

  高额悬赏:
    - "{地点}{发现者}贴出告示：悬赏{悬赏目标}，{赏格}；{补充条款}。"
    - "{时段}{地点}坊市公榜挂出{委托源}的悬赏：{悬赏目标}，{赏格}，须{完成条件}方可领赏。"
    - "{委托源}于{地点}多处张贴告示，悬赏{悬赏目标}，{赏格}，{补充条款}。"
    - "{地点}近来谣传{委托源}暗中加价收{悬赏目标}，{赏格}，{完成条件}。"

  秘境传闻:
    - "{传闻起句}{地点限定}{时段}出现{秘境异象}；老于此道的{发现者}猜测此处或为{秘境性质}，{警示语}。"
    - "{时段}{地点}{地点限定}传出{秘境异象}的消息，{发现者}议论纷纷，多认为是{秘境性质}重新显形，{警示语}。"
    - "{地点}{地点限定}近来频现{秘境异象}，与古籍所载{秘境性质}的征兆相似，{警示语}。"

  宝物现世:
    - "{时段}{地点限定}{出土方式}，传出有{宝物描述}流落民间，若属实其市价当在 {灵石数额} 上下；{追加风声}。"
    - "{地点}{地点限定}{出土方式}，据{发现者}所言出土物中含{宝物描述}，{追加风声}。"
    - "{时段}有{发现者}于{地点}{地点限定}{出土方式}，所得{宝物描述}已在坊间引起注目，{追加风声}。"

  通缉魔修:
    - "{地点}数处张贴告示：悬赏一名{境界档}{性别}修，{罪行}；提供线索者赏 {灵石数额}，{斩首加价}。"
    - "{委托源}于{地点}发布通缉令：缉拿一名{境界档}{性别}修，{罪行}，赏 {灵石数额}，{斩首加价}。"
    - "{时段}起{地点}流传告示：一名{境界档}{性别}修踪迹屡现，{罪行}，赏格 {灵石数额}，{斩首加价}。"

  坊市集会:
    - "{时段}{地点}{地点限定}的{集市名}照例开张，传出本季有 {物品品质}阶{物品类型} 数件与 {物品品质}阶{物品类型} 现于私下交易，{流通补充}。"
    - "{地点}举办{集市名}，吸引各地{发现者}云集；坊间盛传本季成色不俗，{流通补充}。"
    - "{时段}{地点}的{集市名}人潮渐起，主货为 {物品品质}阶{物品类型}，{流通补充}。"

  节令风物:
    - "{地点}{时段}{节令现象}；{民俗反应}；{修行影响}。"
    - "{时段}起{地点}{节令现象}，{发现者}口耳相传，{修行影响}。"
    - "{地点}入此节令，{节令现象}，{民俗反应}；{修行影响}。"

  商道见闻:
    - "{时段}{地点}至{毗邻地}一带商道传出风声：{商道见闻内容}；{后续影响}。"
    - "据自{毗邻地}转入{地点}的{发现者}口述，沿途见{商道见闻内容}，{后续影响}。"
    - "{时段}{地点}与{毗邻地}互通的驿道上，{发现者}皆道：{商道见闻内容}，{后续影响}。"

  灵气潮汐:
    - "{地点}本{时段}起进入{潮汐相位}，{潮汐表现}；{建议}。"
    - "{发现者}于{地点}观测：本季已显{潮汐相位}迹象，{潮汐表现}，{建议}。"
    - "{时段}{地点}进入{潮汐相位}，{潮汐表现}，{发现者}多议论以此为参考，{建议}。"

  古迹奇谭:
    - "{地点}{地点限定}残存的{古迹}近来重被提起，其上{文物形态}写有：「{古文片段}」；对此{解读分歧}。"
    - "{时段}{地点}{地点限定}有{发现者}于{古迹}前拓得新{文物形态}：「{古文片段}」，{解读分歧}。"
    - "据{发现者}转述，{地点}{地点限定}的{古迹}上一段{文物形态}近月被重新辨认：「{古文片段}」；对此{解读分歧}。"

  灵植奇遇:
    - "{传闻起句}{地点限定}有一株{灵植}{灵植状态}，{灵植采集提示}；{灵植警示}。"
    - "{时段}{地点}{地点限定}传出消息：数株{灵植}{灵植状态}，{发现者}已暗中标记其位置，{灵植警示}。"
    - "据{发现者}所言，{地点}{地点限定}近月发现一片{灵植}群落，{灵植状态}；{灵植采集提示}。"
    - "{地点}坊间流出小道消息：{地点限定}有罕见的{灵植}{灵植状态}，{灵植警示}；估市价约 {灵石数额}。"

  时空裂缝:
    - "{时段}{地点}{地点限定}有{发现者}察觉到{时空异象}；据追述，疑似{时空性质}；{化神警示}。"
    - "{发现者}于{地点}{地点限定}观测到{时空异象}，老于此道者认为是{时空性质}的征兆，{化神警示}。"
    - "{地点}{地点限定}{时段}起灵气紊乱处偶现{时空异象}，与{时空性质}的旧载相符，{化神警示}。"


# 字典：按占位符名分组。每个占位符给一个可抽取的候选列表。
# 引擎会等概率抽取（如需加权请按权重数复制条目）。
字典:

  # ---------- 通用 ----------
  传闻起句:
    - "据{发现者}报称，"
