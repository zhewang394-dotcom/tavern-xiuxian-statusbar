  # ---------- 时空裂缝（化神专属）----------
  # 依《世界观》：凡→灵界通道于上古已闭，仅极偶有"空间裂缝"出现且极不稳定。
  # 故此类事件须用"偶现 / 极不稳定 / 不可长期观察"的语气，避免暗示通道复开。
  时空异象:
    - 一处空间略有扭曲
    - 短暂出现的裂痕
    - 周围光线弯折反常
    - 灵气倒灌
    - 时间局部凝滞
    - 影像与本体错位
    - 远方山影显得近在眼前
    - 鸟雀绕飞而不敢靠近
    - 法器靠近会自行震动
    - 神识探入便会反弹
    - 物件穿过即消失片刻又出现
    - 月光在该处折出双重影
    - 投入的石子无声无影
    - 走过此处的脚印于次日错位
    - 同一物在此被见到两次
    - 风过时声音慢半拍
    - 短促出现又消失的虹光

  时空性质:
    - 极小型空间裂缝
    - 上古传送阵残痕
    - 灵界通道边缘的"漏隙"
    - 古战场空间伤口
    - 大能陨落前撕开的虚空残留
    - 仙器自带的小型空间夹层
    - 流星撞击后留下的空间塌缩
    - 凡界三千年来罕见的自然空间皱褶
    - 古之渡灵法阵的微弱回响
    - 极远星辰路径的偶然对接

  化神警示:
    - 非化神后期不可探查
    - 入者九死一生
    - 即将自然弥合
    - 已有大能在密切观察
    - 官方已派员核查
    - 须以护身大阵护体方可靠近
    - 不宜携带任何凡阶法器
    - 一旦闭合不留任何痕迹
    - 切勿入夜时探看
    - 强行进入有撕裂神魂之险
    - 仅可远观，不可干预

