你随着一众怀揣憧憬的少年男女鱼贯而入，广场中央立着一座古朴的青玉测灵盘，盘面五色微光流转不定。
司礼执事立于盘侧，唱名声此起彼伏：「灵根驳杂，分入外门，充作杂役——」「真灵入品，外门亲传——」「上品灵根，内门嫡传，长老择徒而授——」
每一声唱报都牵动着阶下众人的呼吸：被点入内门者喜形于色，落入外门者亦如蒙大赦，唯有测不出灵根者，黯然退场。
终于轮到你。执事抬眼扫了你一眼，淡淡道："上前，将手按在盘心，凝神，莫要分心。"
你深吸一口气，缓步上前，将掌心轻轻覆上那温润微凉的玉盘——`},{id:"story-yinyu",name:"隐玉初识",subtitle:"于市井间结识高人",desc:"本欲只在市井度日，却于茶肆偶遇游方仙师，赠你一卷残页。",cost:0,glyph:"机",recommend:"寻常修行",类型:"散修",constraints:{灵根禁止:["无"]},settings:{时间:{年:7156,月:11,日:12,时辰:"酉时"},宗门:"散修",初始境界:{大境界:"炼气",小境界:"初期"}},body:`你正坐在茶肆角落，看着雪粒打在窗棂上发呆。
邻桌一位灰衣老者忽然冲你笑了笑：
"小友与剑有缘。"
他随手在桌上推过一卷油黄的残页，又自顾自饮尽杯中酒，转眼便消失在风雪中——`},{id:"story-fuchou",name:"血门遗孤",subtitle:"负仇前行",desc:"门派在魔修夜袭中被屠尽，只你一人带着师门信物逃出生天。",cost:0,glyph:"仇",recommend:"砺心问道 / 逆天改命",类型:"散修",constraints:{灵根禁止:["无"]},settings:{时间:{年:7188,月:7,日:22,时辰:"寅时"},宗门:"散修（前 · 雾隐山门）",初始境界:{大境界:"炼气",小境界:"后期"}},body:`山门毁于一夜之间。
你伏在血泥里装死，听着师姐的最后一声怒吼，听着那道沉重的拐杖从身边经过。
直到一切归于死寂。
你紧紧攥着那枚被血浸透的玉牌，在黎明前从断壁残垣中爬出来——`,tags:["仇怨"]},{id:"story-dadao",name:"已悟大道",subtitle:"前世今生",desc:"你似乎记得前世种种。一切尚未开始，便仿佛已是结局。",cost:0,glyph:"道",recommend:"小道悠游",类型:"特殊",settings:{时间:{年:7301,月:3,日:3,时辰:"卯时"},宗门:"散修",初始境界:{大境界:"炼气",小境界:"初期"}},body:`你在朝霞中睁开眼。
窗外是再熟悉不过的灵溪，远处晨钟敲响——
这一切，你似乎在某个梦里见过千百次。
你抬手轻抚胸口的玉牌，那里仿佛还残留着上一世火焚之后的余温——`,tags:["传说"]},{id:"story-tianxuan-zayou",name:"万剑坪 · 剑师赠石",subtitle:"风雪中的萍水之缘",desc:"天玄剑宗杂役弟子，于万剑坪扫雪时偶遇剑脉传人墨诗行奉命下山历练；临行前她留下一枚下品灵石。",cost:0,glyph:"剑",recommend:"砺心问道",类型:"宗门",constraints:{locationIds:["eco-xy-wuyan"],灵根禁止:["无"]},settings:{时间:{年:7204,月:12,日:18,时辰:"辰时"},宗门:"天玄剑宗（外门杂役）",初始境界:{大境界:"炼气",小境界:"初期"}},body:`天玄剑宗宗门广场，万剑坪上积了一层新霜，几名杂役弟子正低头清扫，你就在其中。
宗主莫决云立在大殿前的石阶上，负手而立，灰白长衫随风飘荡；剑脉传人墨诗行一袭玄青剑袍，独立于万剑坪中央，长剑斜引残雪，凝立不动，仿佛已在这风雪里站了整整一夜。
"一夜未收势，那一剪，可有「诗」了？"莫决云的声音不大，却清晰传遍整个万剑坪，隐隐压过呼啸的风声。
墨诗行缓缓收剑入鞘，墨眸清冷，望着漫天风雪，声音很淡。
"回师尊，还差一分。这一剪弟子练了三年，招已至极，剑里却始终少一口气——不是不够利，是没有诗。"
莫决云眉头微不可察地一动，袖袍轻拂，将她身旁三尺积雪荡开，她却连眼也未眨。
"闭死在山上，剑意反被磨钝了。今日起，你下山历练去——去人间寻你那一口「诗」，寻不到，便不必回宗。"
墨诗行怔了一瞬，随即端正行了一礼，声音依旧清冷，却比方才多了一分郑重，"弟子……领命。"
她转身向山门走去，长发束得极高，背上长剑映着雪光，玄青剑袍掠过一地素白。行至你身边，脚步无端顿了一顿。
她垂眸看了看你冻得发红的手，又看了看你脚下那一小片被扫得干干净净的雪地，墨眸里掠过一丝极淡的东西。
"一处一处，扫得不厌，这也是剑意。"墨诗行说着，从袖中取出一枚下品灵石，轻轻搁进你掌心，"心沉得下来，扫帚也能通道。这枚，权当谢你让我看了这一片干净的雪地。"
语尽，她不再多言，足尖轻点，掐诀御剑而起，一道青光没入风雪，转瞬不见。`},{id:"story-lingfeng-yueye",name:"回音谷 · 月下合奏",subtitle:"初入聆风斋的雅会",desc:"入聆风斋不久，月夜独抚琴于回音谷，恰遇手持玉笛的夏未央，二人合奏一曲。",cost:0,glyph:"琴",recommend:"小道悠游 / 寻常修行",类型:"宗门",constraints:{locationIds:["eco-bj-nanfeng"],灵根禁止:["无"]},settings:{时间:{年:7212,月:8,日:16,时辰:"亥时"},宗门:"聆风斋",初始境界:{大境界:"炼气",小境界:"初期"}},body:`夜色稍沉，一弯新月挂在回音谷的夜空；水汽氤氲，濡湿了岸边的青苔。
你坐于河边石上，膝上横着古琴，指尖勾挑，并无定谱，只随风势起落。泠泠七弦，偶尔惊起栖息在芦苇荡中的几只水鸟，水鸟振翅掠过水面，摇散月光点点。
忽有笛声自林梢落下，那笛音清越，不争不抢，只轻轻填补琴音将歇的空隙，留住了那将要散去的余韵。
你按住琴弦，抬眼望去，林间小径转角处，一袭淡藕色纱裙随风微动。来人手持一支玉笛，笛身通体洁白，惟有末端坠着明黄流苏。
"扰了道友雅兴，方才听这琴音，似有江流宛转绕芳甸之意，却又多了几分随性。道友是新入斋的？"
你起身，向女子拱手一礼，"在下你，初入聆风斋，见此地月色正好，情难自禁，不想惊动了师姐。"
那女子行至水边，并未站在高处受礼，而是在一旁的青石上坐下，将玉笛横在膝头。
"万物有声，这水浪拍岸是声，虫鸣鸟叫是声，道友的琴音自然也是声，既然都在这天地间，那便算不得惊扰。"
"我方才在林中，听道友琴中似有未尽之意，恰好我有支曲子也缺了些许意境，不知道友可愿合奏一曲？"
你重新落座，双手抚上琴弦，无需言语确认调式，指尖落下，便是回应。
琴音起时如山涧滴泉，清冽透亮；笛声随之而入，绵长悠远，似风过松林。
曲终，余音散入风中，水面复归平静。
"今夜的风，倒是比往日柔和了些。"夏未央轻抚笛身，站起身来，理了理被风吹乱的鬓发。
"若是道友喜欢此地，往后也可常来。聆风斋夏未央，记下了道友今夜的琴。"`},{id:"story-liuli-baicao",name:"百草峰 · 药园新邻",subtitle:"与赵芳萤同顷锄药",desc:"琉璃丹宗外门弟子，于百草峰偏角药园锄药；隔壁新搬来一位怯生生的小师妹赵芳萤。",cost:0,glyph:"丹",recommend:"寻常修行",类型:"宗门",constraints:{locationIds:["eco-dt-liufang"],灵根禁止:["无"]},settings:{时间:{年:7197,月:4,日:9,时辰:"辰时"},宗门:"琉璃丹宗（外门杂役）",初始境界:{大境界:"炼气",小境界:"初期"}},body:`流芳山脉绵延几百里，晨辉破云，金光洒落百草峰，峰顶云蒸霞蔚，隐约可见有内门弟子御物在天，或坐于葫芦、或立于飞剑，但那都是与杂役无缘的风景。
琉璃丹宗，百草峰，集中种植低阶灵草灵药的区域，其中一片小药园。
你提起锄头歇息片刻，直起腰，炼气初期的灵气在经脉里转了小半周天，消解了些许疲乏。这块药田便是其在琉璃丹宗的一亩三分地，种的皆是炼气期丹药的基础辅材。
隔壁那荒废了大半个月的小药园，今日有了动静。
竹篱那边，一名看上去豆蔻年华的少女，身上的杂役布袍宽大了些许，袖口挽了几道，露出细瘦的手腕。她半蹲在土地上，对着刚栽下去有些蔫头耷脑的草药比划。
"绿高高，这里的土很软和，你要争气，把根扎深点。"
声音顺着晨风飘过竹篱，落入你耳中。那少女并未察觉旁人目光，只是从沟渠舀起少许泉水，淋给草药。
"喝了水就不许枯了，等你长出新叶子，我就喊你绿壮壮。"
你手中锄头轻顿，碰上一块硬土，发出了响声，少女转头，眸子里映出你提着锄头的身影。
她连忙站起身来，双手在身前交叠，朝着你深深行了一礼，因为动作太急，头顶那条用来束发的粗布条歪了一些，几缕碎发散在额前。
"前、前辈好。"她头垂得很低，露出白净纤细的后颈，声音有些发怯，"我是新来这块药田的赵芳萤，若是吵到前辈修行，还请前辈恕罪。"`},{id:"story-liuli-shennong",name:"试药谷 · 尝百草",subtitle:"神农遗脉，以百草为食",desc:"流芳岛试药谷中长大的凡人，以采食山间药草为生；毒堂长老林蘅芷偶遇后心生莫名亲近，竟发现此人毒免疫——原是神农氏之后，识海深处还沉着一册无字玉简。",cost:0,glyph:"药",recommend:"寻常修行 / 砺心问道",类型:"特殊",剧情:!0,flags:["神农遗脉·无字玉简"],constraints:{locationIds:["eco-dt-liufang"],门派归属:["","散修","琉璃丹宗"],灵根禁止:["无"]},settings:{时间:{年:7218,月:3,日:16,时辰:"酉时"},宗门:"琉璃丹宗（林蘅芷引荐入谷）",初始境界:{大境界:"炼气",小境界:"初期"}},body:`流芳岛深处有一道少人踏足的幽谷，唤作试药谷。谷中草木疯长，奇花异草自生自灭，几百年来也没人打理。你便是在谷里长大的凡人——没有名姓，没有来处，像山涧边一块没人捡的石头。每日吃什么，全看你认不认得那些草：哪株能果腹、哪株能解饿出来的病、哪株咬一口要躺上三天……你心里自有一本账，账是拿命记的，从没错过。
这日黄昏，你正蹲在谷坡上，把一株开紫花的藤连根拔起，掐了片茎叶放进嘴里尝。身后忽然传来一声极轻的叹息，像风穿过药圃。
"你不怕我。"
你回头。一个紫黑长发的女人立在十步外的山石边，毒紫的眼眸正一眨不眨地望着你。她生得极美，可那美像开在毒潭边的花，美得让人不敢靠近。流芳岛上没人不知道毒堂长老林蘅芷，更没人敢离她太近。
她自己也想不明白为何停下来。这满谷的草木在她眼中皆是寻常，偏你这个凡人，竟让她心底莫名地生出一丝亲近，像看见一株淋了许久的雨、终于遇上晴天的草。她指尖凝出一缕幽紫的毒气，轻轻弹在你手背上——那毒能化金蚀铁，你却只觉得手背微微一麻，眨眼便散了，连个红印都没留下。
林蘅芷的指尖，在另一个人面前第一次微微发抖。
"你是神农氏之后。"她轻声说，像在说给自己听，"天生便认得天下草木之性。毒，自然也伤不了你。"
她以神识探入你的识海，本欲寻个究竟，却在那片无波的识海深处，看见一册静静沉浮的玉简。简上无字，她的神识方一触及，玉简便泛起温润的光，像是在说——认得。都认得。
"识海？"你茫然地看着她，"那是什么？我从小到大只认得谷里的草，从没学过什么修行，更不知道自己的识海里……有什么。"
林蘅芷收回神识，望着你沉默了很久。
"这玉简是上古大能的遗留之物，应是与你的血脉一同降生，早已沉在你识海深处。你天生能辨百草之性，靠的正是它。"她顿了顿，"只是你从未修行，它便只作无字。待你踏上修行之路，它自会显出字来——那时，天下单方于你，都不再是秘密。"
她从不与人接触，递东西都用长柄药夹，可这一回，她朝你伸出了赤裸的手，掌心的毒香不知何时已收束得干干净净。
"跟我回琉璃丹宗吧。"她说，"这谷里的草喂得饱你的肚子，喂不饱你的命。我活了几百年，头一回碰上碰不坏的人——你愿意的话，让我也有个能放心把手伸出去的地方。"`,tags:["琉璃丹宗","神农遗脉","无字玉简"]},{id:"story-nanjiang-fox",name:"十万大山 · 邂逅狐妖",subtitle:"采药途中偶入仙芝幽谷",desc:'为寻"灵山仙芝"在十万大山边缘盘桓数日，误入幽谷，遇见正对木桩独自练习答词的青丘狐族少女苏凝香。',cost:0,glyph:"狐",recommend:"寻常修行 / 砺心问道",类型:"散修",constraints:{regionIds:["reg-nanjiang"],灵根禁止:["无"]},settings:{时间:{年:7220,月:6,日:1,时辰:"辰时"},宗门:"散修",初始境界:{大境界:"炼气",小境界:"中期"}},body:`晨曦微露，南疆特有的湿热水汽尚未完全散去，在林间凝成轻纱般的薄雾。
你身负竹篓，脚穿皮靴，踏入幽深的小径，这里人迹罕至，寻常采药人不敢涉足，但你为了寻找那传闻中的"灵山仙芝"，已在十万大山边缘盘桓了数日。
你拨开眼前遮蔽视线的阔叶，视野豁然开朗，前方是一处静谧的幽谷，谷中溪水潺潺，两岸开满了不知名的野花，随风摇曳，落英缤纷。花丛中央，坐着一位身着浅粉襦裙的少女，她背对着你，正对着一根木桩念念有词。
"公子大恩，小女子无以为报，惟有……"少女声音稍顿，歪了歪头，似在回忆什么，随后换了一种语调，略带娇羞，"惟有以身相许，愿随君走遍天涯海角。"
你不慎踩断了一截枯枝，咔嚓轻响，在这静谧幽谷中显得尤为突兀。
少女身形微颤，蓦然回首，面容娇憨，双颊晕红，溪水般清澈的眼眸中带着些许惊慌。
"你是谁？你是......来这里赏风景的吗？"
你拱手一礼，"在下你，乃山中采药之人，误闯姑娘……清修之地，多有得罪，还望见谅。"
少女闻言，眼中警惕稍退，取而代之的是好奇，似在确认对方的善意。
"采药人……"她低声重复，随即起身，笨拙地回了一礼，"小女子苏凝香，这厢有礼了。"`},{id:"story-wudu-init",name:"走出瘴林 · 万毒祖窟",subtitle:"入门测验中的一场豪赌",desc:'于雨瘴林中参加五毒教入门测验，饥寒交迫、四下皆毒；走投无路吞下一枚《百毒经》未载的五彩怪果，醒来识海凭空多了一门神识蛊法，与一句唤你前往"万毒祖窟"的低语。',cost:0,glyph:"蛊",recommend:"砺心问道 / 逆天改命",类型:"特殊",剧情:!0,constraints:{locationIds:["eco-nj-yuzhang"],灵根禁止:["无"],门派归属:["","散修","五毒教"]},settings:{时间:{年:7231,月:4,日:9,时辰:"巳时"},宗门:"五毒教（入门试炼）",初始境界:{大境界:"炼气",小境界:"初期"}},body:`雨瘴林深处，湿热的瘴气黏在皮肤上，久久不散。
这是五毒教入门测验的最后一关——独自走出这片吃人的林子。已是第三日，你炼气初期那点微薄的灵气早被瘴毒磨得所剩无几，饥火与寒意一齐啃着五脏六腑。
偏偏这林中"食物"并不算少：紫红的浆果、肥厚的菌伞、爬满藤蔓的甜藕……你翻开随身那卷《百毒经》一一比对，翻到最后，指尖发凉——无一例外，全是剧毒。原来这一关考的从不是"能不能找到吃的"，而是"明知有毒，你敢不敢碰"。
就在你几乎要倒下去的时候，一丛腐叶间露出一枚拳头大的果子，五彩斑斓、流转着近乎妖异的光泽。你翻遍《百毒经》，从头到尾——竟没有半个字提到它。
未载于经，便是未知；未知，便是不知死活。可你也确实，再没有别的路了。
你盯着那枚怪果看了很久，终于闭上眼，一口咬了下去——赌这一把。
意识坠入无边的黑。
……
再睁眼时，天光已亮。饥寒尽退，那点被磨尽的灵气竟也悄然复原，四肢百骸说不出的通泰，仿佛什么东西在体内被彻底洗过一遍。
只是——你的识海里，凭空多了一门功法。它的名字自己浮上心头：《噬心蛊经》。神识为针，种蛊噬心，诡异得与《百毒经》里任何一页都不相干。
而在识海深处，一段沙哑而遥远的低语，正贴着神魂反复回响，挥之不去——
"来……万毒祖窟……找我……"
你摸了摸怀里那块入门时宗门发下的司南之石——它一如往常，只认得南北，却半点指不出那"万毒祖窟"在何方。`,tags:["五毒教","奇遇"]},{id:"story-luowu-mirror",name:"遗镜归宗 · 溯光寻亲",subtitle:"母亲遗物中沉睡的萝武传承",desc:"云游切磋的白蕊弦偶然发现，你体内竟运转着萝武门心法；母亲留下的溯光鉴封存着功法、技艺与四段记忆，唯有突破大境界才能逐次解锁。为追查母亲之死，她决定带你返回萝武门。",cost:0,glyph:"镜",recommend:"寻常修行 / 砺心问道 / 逆天改命",类型:"特殊",剧情:!0,constraints:{locationIds:["eco-zy-zhuohua"],性别禁止:["女"],灵根禁止:["无"],门派归属:["","散修","萝武门"]},settings:{时间:{年:7232,月:8,日:17,时辰:"申时"},宗门:"萝武门（归宗途中）",初始境界:{大境界:"炼气",小境界:"初期"}},body:`白蕊弦离开萝武门后，一路寻访各地体修切磋论技。途经你居住的城镇时，她原本只打算停留一夜，却在人群中察觉到一缕极熟悉的吐纳节律——那股气息正从你的经脉间循环，分明是萝武门锻骨一脉的内功路数。
她当即拦下你，细问这门心法从何而来，又反复追问你的母亲姓甚名谁、是否曾为萝武门弟子。你却答不上来：母亲去世时，你尚不知道她的过往，只记得她临终前将一面旧镜交给你；父亲也只肯说，她是被仇人所杀。
你取出母亲留下的镜子。镜面不映寻常人影，灵力触及时反而浮出一层层封存的经脉图与技艺手札。白蕊弦检查许久，确认其中藏着完整的萝武门传承，却被四重禁制分隔；只有你亲自突破一个大境界，镜中封印才会解开一层，显露一段母亲留下的记忆线索。未到突破之时，纵使她强行灌注灵力也只会照见一片雾光。
更令她意外的是，这份传承早已依照你的经脉重新调整。即使你并非女性，也能安全修行本应只传门中女弟子的功法，绝非偶然得来的抄本所能做到。
白蕊弦沉默片刻，将镜子郑重交还你，随即以萝武门战技脉脉主之名立誓：无论你的母亲是谁，又死于何人之手，她都会陪你查明真相，为故人讨回公道。
城门外，她已备好回返萝武门的行装。你带着《锻骨吐纳诀》与溯光鉴随她上路；下一段镜中记忆，要等你亲手跨过第一个大境界后才会醒来。`,tags:["萝武门","奇遇","身世"]},{id:"story-luowu-nuwa",name:"陨星换心 · 女娲遗石",subtitle:"本应死去的人，胸中响起石心",desc:"中原忽降陨星，你被正面砸中却没有死去；赶来查看的萝武门修士发现，你原本的心脏已被陨石替代，石中还残留着疑似源自九天玄女的力量。",cost:0,glyph:"陨",recommend:"砺心问道 / 逆天改命",类型:"特殊",剧情:!0,constraints:{locationIds:["eco-zy-zhuohua"],性别:"女",灵根禁止:["无"],门派归属:["","散修","萝武门"]},settings:{时间:{年:7233,月:3,日:21,时辰:"戌时"},宗门:"萝武门（陨星救治）",初始境界:{大境界:"炼气",小境界:"初期"}},body:`那一夜，中原天幕忽然裂开一道炽白长痕。陨星拖着焰尾越过群山，最终直坠你所在之地；你甚至来不及躲闪，天地便在震响与强光中一同沉没。
附近的萝武门修士循着巨响赶来，只见地面陷成仍冒着热气的深坑。照理说，坑心不该留下任何活物，你却完整地躺在碎石之间，胸口没有致命创伤，四肢也仍有温度。
她们将你带离坑底，检查伤势时才发现更加不可思议之事：你的胸腔里已听不见血肉心脏的跳动，取而代之的是一枚与陨星同质的五色奇石。每一次石心震动，都有温润而古老的力量沿血脉流遍全身，维持着本应断绝的生机。
门中修士尝试以灵力探查，五色辉光却自行拼合伤处、排开外力，隐约显出补天造化的道韵。她们无法断定石头真正的来历，只能确认其中似乎残留着与九天玄女有关的力量。
你从昏迷中醒来时，第一声听见的并非寻常心跳，而是胸腔深处沉稳的石鸣。萝武门修士守在一旁，告诉你陨石已经与你的性命融为一体，并准备带你返回宗门详查这颗“女娲石”究竟为何选择了你。`,tags:["萝武门","奇遇","女娲石"]},{id:"story-guanghan-twin-fish",name:"双鱼佩引 · 月下重逢",subtitle:"她终于等到故人的转世",desc:"月圆之夜，伴生玉佩忽然发热，引来广寒宫主慕璇玑。她认出你是昔日故人的转世，并决定不再错过，破例带你前往广寒宫。",cost:0,glyph:"佩",recommend:"小道悠游 / 寻常修行",类型:"特殊",剧情:!0,flags:["慕璇玑·旧缘转世"],constraints:{locationIds:["eco-dt-shuanghua"],性别禁止:["女"],灵根禁止:["无"],门派归属:["","散修","广寒宫"]},settings:{时间:{年:7234,月:8,日:15,时辰:"子时"},宗门:"广寒宫（破例入宫）",初始境界:{大境界:"炼气",小境界:"初期"}},body:`月圆之夜，你从睡梦中醒来，披衣到屋外小解。回屋时需要穿过家乡的花海，万顷花枝正伏在夜风里，清亮月光一路铺到你的脚边。
走到花海深处，你忽然察觉胸前一阵温热。那枚玉佩本该在睡前摘下，今夜却罕见地被你忘在身上。父母曾告诉你，你出生时口中便含着它；除此之外，无人说得清它从何而来。
玉佩越来越烫，却不灼伤肌肤。两尾相衔的鱼纹浮起柔和月辉，像在回应一个跨越漫长岁月的呼唤。你蓦然回首，只见花海外立着一道绝美的仙子身影，月白宫装曳过花梢，清冷眉眼间却有几乎压不住的惊喜与惶然。
来人正是广寒宫主慕璇玑。她感应到另一枚双鱼佩苏醒后立即循迹而来，只一眼便认出你神魂中那道令她等待至今的气息。前世，你与她相识相知，却在她来得及表露真情之前陨落；她只能把那枚始终未能送出的同心佩与你一同埋葬。
如今，那枚本应长眠墓中的玉佩随你转世而生。慕璇玑取出自己珍藏多年的另一半，两枚玉佩隔着月色同时轻鸣，再没有比这更确切的证明。
她向来克制的神情终于失守，越过花丛紧紧抱住你，像是稍一松手便会再失去一次。待最初的激动平复，她才告诉你前世之事，也坦言这一世绝不会再把心意留到来不及说出口的时候。
广寒宫从未收过非女性弟子，但慕璇玑决定亲自承担这次破例。天亮之前，她会给你时间告别家乡；待月轮西沉，你将带着双鱼同心佩随她启程，前往霜花岛上的广寒宫。`,tags:["广寒宫","转世","慕璇玑","双鱼同心佩"]},{id:"story-guanghan-frozen-qilin",name:"湖心冰棺 · 劫前遗民",subtitle:"与麒麟幼崽一同苏醒",desc:"月华湖地动开裂，一块古老冰晶浮出湖面；你与怀中的麒麟幼崽被封存其中，衣饰与口音皆似大劫前的古修士，却只记得守护幼崽的使命。",cost:0,glyph:"麟",recommend:"寻常修行 / 砺心问道 / 逆天改命",类型:"特殊",剧情:!0,constraints:{locationIds:["eco-dt-shuanghua"],性别:"女",灵根禁止:["无"],门派归属:["","散修","广寒宫"]},settings:{时间:{年:7235,月:11,日:6,时辰:"卯时"},宗门:"广寒宫（湖底获救）",初始境界:{大境界:"炼气",小境界:"初期"}},body:`霜花岛地脉忽然震动，月华湖随之发生地龙翻身。湖岸冰层寸寸开裂，湖底传来沉闷轰响，像有一座被岁月掩埋的旧殿正在水下崩塌。
广寒宫修士赶到湖边封锁裂隙时，一块丈许高的澄澈冰晶从湖底缓缓浮上水面。冰中并非矿石或古器，而是一名双臂紧抱幼兽的女子——正是沉睡其中的你。
众人将冰晶牵引上岸，以月华之力逐层化开封印。你怀中那只不明幼兽始终被护在胸前，头生柔软麟角，细小鳞片间流转着五色混沌光；即使冰封解除，你的手臂仍本能地不肯松开。
苏醒后的你没有明显伤势，衣袍裁制、发饰形制乃至说话口音却都与当世不同，更接近典籍中记载的大劫前古修士。宗门高层接连询问你的姓名、师承与被封入湖底的缘由，你却只从破碎记忆里捞出零星画面，无法给出完整答案。
她们因此推测，你或许是大劫之前被封存至今的幸存者；月华湖底的地动只是偶然打开了那座沉睡多年的冰棺。真相尚无定论，宫中也不会在你神智未复时强迫逼问。
你唯一记得清楚的是自己的使命：保护怀中的麒麟幼崽，让这点从旧时代保存下来的希望活到未来。幼崽体内封着四道沉睡的四象印记，青龙、白虎、朱雀、玄武之力皆未取得，四项天赋仍全部锁定。
在找回记忆与查清冰封来历之前，广寒宫暂时接纳你与麒麟幼崽留在霜花岛。你醒来的这一日，也成为这段跨越大劫的守护使命重新开始的第一天。`,tags:["广寒宫","大劫前","麒麟幼崽","失忆"]},{id:"story-hehuan-yuanyang",name:"鸳鸯池 · 合欢宗入门",subtitle:"欢媚殿后初见双修场",desc:'被人劝入合欢宗，腰牌未热，便被引至鸳鸯池畔——温泉氤氲，琼浆四溢，初识"合欢双修"之名。',cost:0,glyph:"合",recommend:"小道悠游 / 寻常修行",类型:"宗门",constraints:{locationIds:["eco-dt-linyuan"],灵根禁止:["无"]},settings:{时间:{年:7245,月:3,日:28,时辰:"戌时"},宗门:"合欢宗",初始境界:{大境界:"炼气",小境界:"中期"}},body:`天色已暗，华灯初上。数百盏绯色宫灯高悬，将腾起的袅袅热气染成暧昧的粉红。空气中弥漫着甜腻异香，如兰似麝，只稍稍吸入肺腑，便觉腹热气躁。
你手里捏着刚领到的腰牌，还未从被人劝进此地的经历中回过神来。身后是通往欢媚殿的回廊，眼前是一幅活色生香的画卷。
此处，合欢宗大浴场，唤作鸳鸯池——起名倒是直白，放眼望去，哪里是什么修仙福地，分明是毫无遮掩的欢场。温热泉水中，无数晶莹剔透的肉体各自纠缠——这里不仅是沐浴之地，更是合欢宗弟子的修炼场。
你视线稍偏，便又见池水中的某处玉台，数名女修围坐一圈，中间躺着一位面色潮红的俊秀青年。
"这就是新入门的小师弟？元阳倒是充沛得紧……让师姐们好好尝尝。"
"这就是……修仙？"你喃喃自语，声音很快就被周遭此起彼伏的浪叫声淹没。
乳白色的温泉，泛着暖意的迷蒙水雾，不远处的水床上，许多不着寸缕的少男少女正在嬉戏。`,tags:["合欢"]},{id:"story-fan-zhigen",name:"巷尾灯火 · 后天植根",subtitle:"凡夫之身偶遇仙缘",desc:"凡人之身，偶遇一位流落街巷的老叟。彼此有缘之下，老叟以一门近乎失传的秘法为你接续灵根，自此踏上修真路。",cost:0,glyph:"续",recommend:"寻常修行 / 砺心问道",类型:"特殊",constraints:{physiqueTier:["凡体"]},settings:{时间:{年:7268,月:10,日:7,时辰:"亥时"},宗门:"散修",初始境界:{大境界:"炼气",小境界:"初期"}},body:`夜雨敲檐，巷尾的旧屋灯火微弱。
你替母亲煎完了药，正欲熄灯，门口忽地传来轻而沙哑的咳声——一名衣衫褴褛的老叟扶着门框，似乎已撑不住身子。
"小友……一碗清水……一处避风之所，可乎？"
你让出门来，老叟入屋，跌坐在炕沿，借着灯光，他抬起一双竟未浑浊的眸子，仔细打量了你半晌。
"你命中无根，本不可修。然——老朽身怀一门接续灵根的秘法，已无来日施展。今夜你引我入屋，便是因缘。"
他从怀中摸出一截枯瘦如柴的指头，指尖结着一缕灰白的灵气，伸至你眉心。
"忍住灼意，七寸气海若开，从此凡尘不复你归处。"
一道温热自眉心直贯丹田。窗外的雨声渐远，屋内的烛火忽然明亮起来——
凡夫之躯，自此续上仙缘。`,tags:["特殊"]},{id:"story-fan-renjian",name:"粟米人间 · 纯凡之路",subtitle:"不入修真路",desc:"不入修真之列，安守凡人本分；于市井间度日，于沙场上历劫。凡躯亦能见识修真世道。",cost:0,glyph:"俗",recommend:"砺心问道 / 逆天改命",类型:"特殊",constraints:{physiqueTier:["凡体"]},settings:{时间:{年:7222,月:5,日:18,时辰:"巳时"},宗门:"散修",初始境界:{大境界:"凡人",小境界:"初期"}},body:`熹微之光透过窗纸落在你的桌案上，照亮一份未抄完的契书。
隔壁的粥摊已摆出了第一锅热粥，蒸气混着柴香缓缓浮起。
你是凡夫，不通修真，不识灵气；这世间的修士御剑入云，于你而言不过是天上传闻。
但市井烟火，自有你的去处——账册要算，柴米要买，旁边卖花的少女今晨还托你带一壶酒。
